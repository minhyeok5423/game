    -webkit-overflow-scrolling: touch;

 흔든다.'],['라바','파도가 이름을 훑고 지나가고 있다! 붙들어!'],['리안','이름을 소리 내 불러요! 서로의 이름을요!'],['','네 사람은 서로의 이름을 번갈아 외치며 갑판에서 버텼다.'],['','','B',29],['','파도가 갈라지고, 수면 아래에서 거대한 서가의 탑이 떠올랐다. 장부의 심장이었다.'],['','','T'],['','','S','archive'],['','장부의 심장 입구. 수호상들이 책을 껴안은 채 길을 막고 서 있다.'],['치엘브','책을 지키는 건 좋은 일이지. 지우는 일에 쓰이지만 않았다면.'],['','','B',30],['','수호상이 무너지자 안쪽 계단이 열렸다. 아래에서 오래된 먹 냄새가 올라왔다.'],['네리','이 아래가 가장 깊은 곳이겠죠. 모두 준비됐어요?'],['','','T'],['','','S','archive'],['','심층의 서가. 벽마다 이름 없는 장이 빼곡하고, 그 한가운데 높은 단 위에 누군가 앉아 있다.'],['리안','…저 사람이 장부 위의 인장을 쥔 자예요.'],['','먼저 서기들과 수호상들이 줄지어 일어나 길을 막았다.'],['','','B',31],['','마지막 서가가 열리자 단 위의 그림자가 천천히 일어섰다.'],['재의 군주','…드디어 이름을 든 자가 여기까지 왔군. 기다렸다.'],['치엘브','당신이 이 모든 지움의 끝인가?'],['재의 군주','나는 최초의 기록관이었다. 모든 이름을 적다가, 이름의 무게에 깔려 모든 것을 지우기로 했지.'],['네리','무게가 힘들다고 지우는 건 답이 아니에요.'],['재의 군주','그렇다면 증명해라. 이름은 지워지지 않는다고.'],['','','T'],['','','S','top'],['','군주가 일어서자 서가의 책들이 일제히 펄럭이며 재로 변했다. 모든 이름이 그를 향해 빨려 들어간다.'],['치엘브','이름을 돌려받겠소. 하나도 빠짐없이.'],['그란','문이 닫혔다면 부수면 된다. 앞은 내가 연다.','O','gsw'],['벨라','큰 상대일수록 조련하는 보람이 있죠. 채찍 준비됐어요.','O','whp'],['미르','자, 다 같이 노래해요! 이름을 걸고 힘내요!','O','buf'],['엘로아','이만한 서고라면 불태우지 않게 조심해야겠네요. 아슬아슬하게 해 볼게요.','O','mag'],['시안','…그림자 속에서 기회를 보겠다. 신호만 줘.','O','ass'],['카데나','사슬로 묶어 둘 수 있는 만큼은 제가 묶어 둘게요.','O','cad'],['바르크','내 뒤에 서라. 첫 일격은 내가 받는다.','O','brk'],['제피르','기다리는 건 질색이야. 빨리 끝내자!','O','zep'],['레이카','찌릿하게 끝내 줄게. 다들 감전 조심!','O','ray'],['핍','이번엔 판돈이 크네요. 주사위가 우리 편이길.','O','pip'],['도도','큰 한 방이 필요하다고? 내 화약통을 믿어!','O','dod'],['베나','독은 천천히 퍼지죠. 군주님도 곧 알게 될 거예요.','O','ven'],['시린','모든 걸 얼려 둘게요. 지움이 번지기 전에.','O','sir'],['카르민','저 힘, 조금 탐나는군. 피 한 방울 남기지 않고 끝내 주지.','O','car'],['템포','시간은 제가 벌어 볼게요. 다들 마음껏 움직여요!','O','tem'],['','','B',32],['','군주의 몸이 재로 흩어지며, 손에 쥐고 있던 큰 장부가 바닥으로 떨어졌다.'],['재의 군주','…이렇게 가벼운 거였나. 이름이란.'],['리안','사라져 가요. 하지만 이름은 장부에 남았어요.'],['','','T'],['','','S','clear'],['','카엘 항의 새벽. 먹빛이던 바다가 투명해지고, 항구의 이름판에 글자가 하나둘 돌아온다.'],['오르비','등대에 불이 들어왔구먼. 몇 십 년 만이야.'],['네리','배 이름, 정해야죠. 치엘브 씨?'],['치엘브','…《이름들》. 그 정도면 됐소.'],['라바','나쁘지 않군.'],['리안','스승님 이름도 부를 const TNX_RW=[0,40,120,300,700,1500],TNX_PW=[3,5,8,14,30],TNX_DM=[1,1.5,2,3];
const TNX_MODS=[{n:'표준전',d:'4명 편성 · 적 스탯 표준',size:4,sc:1},{n:'소수정예',d:'3명 편성 · 적 스탯 표준',size:3,sc:1},{n:'거인의 주',d:'4명 편성 · 적 스탯 +15%',size:4,sc:1.15},{n:'외로운 늑대',d:'2명 편성 · 적 스탯 -10%',size:2,sc:.9}];

function tnxSave(){try{localStorage.setItem(TNX_KEY,JSON.stringify({x:G.tnx,w:G.tnw}))}catch(e){}try{window.FRU&&FRU()}catch(e){}}
function tnxInit(){const x=G.tnx=G.tnx||{};x.pre=Array.isArray(x.pre)?x.pre:[null,null,null];while(x.pre.length<3)x.pre.push(null);x.pts=x.pts||0;x.titles=x.titles||[];x.wk=x.wk||{id:null,pts:0};x.wkClr=x.wkClr||0;x.title=x.title||'';x.note=x.note||'';return x}
function tnxSeasonNow(){const d=new Date(),y=d.getFullYear(),m=d.getMonth()+1;return{id:y+'-'+tnxPad(m),dim:new Date(y,m,0).getDate(),day:d.getDate()}}
function tnxWeek(){const d=new Date(),loc=d.getTime()-d.getTimezoneOffset()*6e4,days=Math.floor(loc/864e5),wk=Math.floor((days-4)/7),mon=new Date((wk*7+4)*864e5),n=TNX_MODS.length;
  return{id:'W'+wk,wk,seed:((wk*2654435761)>>>0)||1,mod:TNX_MODS[((wk%n)+n)%n],label:(mon.getUTCMonth()+1)+'월 '+mon.getUTCDate()+'일 주'}}
const tnxTier=p=>{let t=0;TNX_TIERS.forEach((v,i)=>{if(p>=v[1])t=i});return t};
/* 가상 라이벌: 시즌 ID로 만든 고정 점수(이번 달 일수에 맞춰 천천히 오름) */
function tnxRivals(ssn,final){const s=tnxSeasonNow(),h=[...ssn].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7),prog=final?1:Math.min(1,(s.day-.4)/s.dim);
  return TN_NAMES.slice(0,9).map((n,i)=>{const r=tnMul(h+i*7919),F=Math.round(40+Math.pow(r(),1.6)*1100),e=.7+r()*.8;return{n,F,cur:Math.round(F*Math.pow(prog,e))}})}
const tnxRank=x=>1+tnxRivals(x.ssn).filter(r=>r.cur>x.pts).length;
function tnxGive(id,name,lines){const x=G.tnx;if(x.titles.some(t=>t.id==id))return false;x.titles.push({id,n:name});if(lines)lines.push('🏅 칭호 획득: '+name);else tnToast('🏅 칭호 획득: '+name);return true}
window.__tnx={give:(...a)=>tnxGive(...a),save:()=>tnxSave()};const tnxTitle=()=>{try{const x=tnxInit(),t=x.titles.find(t=>t.id==x.title);return t?t.n:''}catch(e){return''}};
/* 시즌/주간이 바뀌었는지 확인하고 마감 보상·칭호를 지급 */
function tnxSync(){
  const x=tnxInit(),s=tnxSeasonNow(),w=tnxWeek();
  if(x.ssn&&x.ssn!==s.id){
    const old=x.ssn,lab=old.replace('-','.'),ti=tnxTier(x.pts),rk=1+tnxRivals(old,1).filter(r=>r.F>x.pts).length,L=[];
    if(TNX_RW[ti]){G.coin+=TNX_RW[ti];L.push('🪙 +'+TNX_RW[ti]);try{$('#coin').textContent='🪙 '+G.coin}catch(e){}}
    if(ti>=2)tnxGive('s'+old+'_t','‹'+lab+'› '+TNX_TIERS[ti][0]+' 검투사',L);
    if(window.FRP&&FRP(old,x.pts,lab)){}else if(rk==1&&x.pts>0)tnxGive('s'+old+'_1','‹'+lab+'› 시즌 왕좌',L);
    x.note=lab+' 시즌 마감 — '+TNX_TIERS[ti][0]+' · '+x.pts+'점'+(window.FRO&&FRO()?'':' · '+rk+'위')+(L.length?' · '+L.join(' · '):'');
    x.ssn=null;
  }
  if(x.ssn!==s.id){x.ssn=s.id;x.pts=0;tnxSave()}
  if(x.wk.id!==w.id){x.wk={id:w.id,pts:0};tnxSave()}
  return x}
function tnxCalc(run,k){const x=tnxSync(),base=Math.round(TNX_PW[k]*TNX_DM[run.diff]);
  if(run.weekly!=null){if(x.wk.id!==run.weekly)return 0;return Math.max(0,(run.cum||0)+base*2-x.wk.pts)}
  return base}
function tnxWin(run,k){
  const x=tnxSync(),base=Math.round(TNX_PW[k]*TNX_DM[run.diff]);let add=base;
  if(run.weekly!=null){const w=x.wk;if(w.id!==run.weekly)add=0;else{run.cum=(run.cum||0)+base*2;add=Math.max(0,run.cum-w.pts);w.pts+=add}}
  if(add){const t0=tnxTier(x.pts);x.pts+=add;run.sp=(run.sp||0)+add;const t1=tnxTier(x.pts);
    if(t1>t0){const msg='🏆 시즌 등급 상승: '+TNX_TIERS[t1][0];tnToast(msg);(run.gain=run.gain||[]).push(msg)}}
  tnxSave()}
function tnxDone(run){
  const x=tnxSync();if(run.champ!==0||run.practice)return;run.gain=run.gain||[];
  if(run.diff==3)tnxGive('c_hell','극악의 우승자',run.gain);
  if(run.weekly!=null&&x.wk.id===run.weekly){const w=x.wk,wl=tnxWeek();w.c=w.c||{};
    if(!w.c[run.diff]){w.c[run.diff]=1;x.wkClr=(x.wkClr||0)+1;
      tnxGive('w'+run.weekly+'_'+run.diff,'‹'+wl.label+'› '+TN_DIFF[run.diff].n+' 우승',run.gain);
      if(x.wkClr>=1)tnxGive('m_w1','주간 도전자',run.gain);if(x.wkClr>=5)tnxGive('m_w5','주간 정복자',run.gain);if(x.wkClr>=10)tnxGive('m_w10','주간의 지배자',run.gain)}}
  tnxSave()}

const tnFmt=v=>Math.round(v).toLocaleString('ko-KR');
function tnMvp(us){let b=null,bs=0;us.forEach(u=>{const v=(u.stD||0)+(u.stH||0)*1.2+(u.stT||0)*.5;if(v>bs){bs=v;b=u}});return b}
function tnStatRows(B,side){
  const all=B.P.concat(B.E),mx=k=>Math.max(1,...all.map(u=>u[k]||0)),us=side=='p'?B.P:B.E,mv=tnMvp(us);
  const bar=(c,v,m)=>`<div class="b ${c}"><i style="width:${Math.round(v/m*100)}%"></i><span>${tnFmt(v)}</span></div>`;
  return us.map(u=>`<div class="sr${u.alive?'':' dead'}"><span class="ic" style="background:${u.col}">${u.ic}</span><div class="sn"><b>${u.n}</b>${u===mv?'<em>MVP</em>':''}</div><div class="sbs">${bar('d',u.stD||0,mx('stD'))}${bar('h',u.stH||0,mx('stH'))}${bar('t',u.stT||0,mx('stT'))}</div></div>`).join('')}
function tnStatSum(B,side){const us=side=='p'?B.P:B.E,top=k=>us.reduce((a,u)=>(u[k]||0)>(a?a[k]||0:0)?u:a,null),d=top('stD'),h=top('stH'),t=top('stT');

TNS.afterMatch=function(win){
  const run=TNS.run,dv=TN_DIFF[run.diff],k=run.rd;G.tnw.p++;
  if(win){G.tnw.w++;const rw=Math.round(TN_RW[k]*dv.rw);G.coin+=rw;run.rewards+=rw;tnToast('🪙 +'+rw);try{tnxWin(run,k)}catch(e){console.warn(e)}}
  const resolve=(r,forced)=>{TNS.rng=run.seed!=null?tnMul(run.seed*977+r*31+11):null;const P=run.P[r],nx=[];run.res[r]=[];
    for(let j=0;j<P.length;j+=2){const w=(j==0&&forced!=null)?forced:tnSimAI(run,P[j],P[j+1],r);run.res[r][j/2]=w;nx.push(w)}
    return nx};
  let nx=resolve(k,win?run.P[k][0]:run.P[k][1]);
  if(nx.length==1){run.champ=nx[0]}
  else{run.P[k+1]=nx;
    if(win)run.rd=k+1;
    else{let r=k+1;for(;;){const n2=resolve(r,null);if(n2.length==1){run.champ=n2[0];break}run.P[r+1]=n2;r++}}}
  if(!win||k==TN_RND.length-1){run.state='done';run.out=k;if(run.champ==0)G.tnw.champ++}
  TNS.rng=null;if(run.state=='done'){try{tnxDone(run)}catch(e){console.warn(e)}}tnxSave();

<script id="chapter45b-arbiter">

   - 최하 등급(D)은 더 내려갈 곳이 없어 강등되지 않는다.
   - 기본은 시간이 지나면 해제. 리안의 「이름 부르기」(1명) · 「이름의 서약」(전체)으로 정화 가능.

(function(){

function demote(u,n,t){

  if(eff<=0){pop(u.id,'강등 불가');log(`⬇ ${u.n}은(는) 이미 최하 등급이라 더 내려갈 곳이 없다`);return 0}

  const T=mode=='all'?L:[L.slice().sort((x,y)=>loss(y)-loss(x))[0]];
  T.forEach(u=>release(u,'리안의 정화'))};
{const N0=nr;nr=function(){N0.apply(this,arguments);try{S.U.forEach(u=>{if(u.side=='a'&&u.alive&&u.dem&&--u.dem.t<=0)release(u,'시간 경과')})}catch(e){}}}

/* ---------- 보스 초기화 ---------- */
{const S0=spawn;spawn=function(){S0.apply(this,arguments);

{const C0=chk;chk=function(){

{const BA0=bossAct;bossAct=async function(b){

document.head.insertAdjacentHTML('beforeend','<style id="arbcss">.demc{font-style:normal;font-size:9px;padding:0 4px;margin-left:4px;border-radius:6px;background:#3a2410;border:1px solid #d08a3a;color:#ffcf8a;white-space:nowrap}.arbtg{display:block;font-size:9px;font-weight:700;color:#ffd0c8;background:#5a1d18;border:1px solid var(--rd);border-radius:6px;padding:0 5px;margin-top:2px;text-align:center}.u.tg{animation:arbp 1s infinite}@keyframes arbp{50%{box-shadow:0 0 18px #ff6a55cc}}</style>');

{const R0=render;render=function(){R0.apply(this,arguments);
  try{if(!S||!S.U)return;

const ST=(id,p)=>{try{sfxU(id,p)}catch(e){}};
const clean=()=>{document.body.classList.remove('shk','fsx');['fs','fx'].forEach(i=>{const e=document.getElementById(i);if(e){e.className='';e.innerHTML=''}});skip=false};
const FX_SUP_ALL=new Set(['첫 숨','새벽의 기적']),FX_SUP_ONE=new Set(['영웅의 노래','되감긴 종소리']),FX_SPLASH=new Set(['대형 포탄']);
const FX_AOE=/적 (?:전체|전원)(?:에게|에)\s*(?:공격력|냉기)|적 (?:전체|전원)\s*\d|^\s*전체\s*\d/;
const fxRect=el=>{const r=el.getBoundingClientRect();return r.width>2&&r.height>2?{l:r.left,t:r.top,w:r.width,h:r.height}:null};
const fxUnion=a=>{const l=Math.min(...a.map(r=>r.l)),t=Math.min(...a.map(r=>r.t)),R=Math.max(...a.map(r=>r.l+r.w)),B=Math.max(...a.map(r=>r.t+r.h));return{l,t,w:R-l,h:B-t}};
const fxCards=side=>{const els=[...document.querySelectorAll(side==='b'?'#bt .bsw .bs':'#bt .al .u')];return S.U.filter(x=>x.side===side).map((x,i)=>({u:x,r:els[i]?fxRect(els[i]):null})).filter(o=>o.r)};
/* 이번 필살기가 어디를 때리는지 계산 (못 구하면 null → 예전 고정 위치 연출) */
function fxPlan(u,s,hint){
 try{
  if(typeof S==='undefined'||!S||!S.U)return null;
  const caster=S.U.find(x=>x.id===u.id&&x.side==='a');
  if(!caster){ /* 보스 컷: 지목된 아군이 있을 때만 */
   if(!hint)return null;
   const o=fxCards('a').find(o=>o.u.id===hint);
   return o?{mode:'one',area:o.r,hits:[{r:o.r,f:1.3}]}:null}
  const n=(s&&s.n)||'';let kind='foeOne';
  if(FX_SUP_ALL.has(n))kind='allyAll';else if(FX_SUP_ONE.has(n))kind='allyOne';else if(FX_SPLASH.has(n))kind='splash';
  else{const sk=((typeof DT!=='undefined'&&DT[u.id]&&DT[u.id].sk)||[]).find(k=>k[0]===n);if(sk&&FX_AOE.test((sk[3]||'')+' '+(sk[4]||'')))kind='foeAll'}
  const all=(side,alive)=>fxCards(side).filter(o=>!alive||o.u.alive);
  if(kind==='foeAll'||kind==='allyAll'){
   const L=all(kind==='foeAll'?'b':'a',1);if(!L.length)return null;
   return{mode:'all',area:fxUnion(L.map(o=>o.r)),hits:L.map(o=>({r:o.r,f:1.3}))}}
  if(kind==='allyOne'){
   const id=S.bpk||S.lpk||u.id;S.lpk=null;
   const o=fxCards('a').find(o=>o.u.id===id)||fxCards('a').find(o=>o.u.id===u.id);
   return o?{mode:'one',area:o.r,hits:[{r:o.r,f:1.3}]}:null}
  const tg=(typeof T==='function')?T():null,B=all('b',1);
  const m=B.find(o=>o.u===tg)||B[0];if(!m)return null;
  const hits=[{r:m.r,f:1.3}];
  if(kind==='splash')B.forEach(o=>{if(o!==m)hits.push({r:o.r,f:.8})});
  return{mode:'one',area:m.r,hits}
 }catch(e){console.warn('fxPlan',e);return null}
}
/* 기존 #fx 이펙트(.at)를 대상 범위 안으로 옮겨 담는다: 화면 전체 좌표계를 대상 사각형에 맞춰 축소·이동 */
function fxBuild(fx,plan){
 const W=fx.clientWidth||innerWidth,H=fx.clientHeight||innerHeight,A=plan.area,all=plan.mode==='all';
 const mag=all?1.15:1.6,K=all?2:1.35,pad=all?10:6;
 let sx=A.w/W*mag,sy=A.h/H*mag;const b=Math.min(sx,sy);sx=Math.min(sx,b*K);sy=Math.min(sy,b*K);
 const bl=A.l-pad,bt=A.t-pad,bw=A.w+pad*2,bh=A.h+pad*2;
 const tx=(A.l+A.w/2-bl)-sx*W/2,ty=(A.t+A.h/2-bt)-sy*H/2;
 const hits=plan.hits.map(h=>{const d=Math.min(Math.max(Math.min(h.r.w,h.r.h)*(h.f||1.3),46),H*.46),cx=h.r.l+h.r.w/2,cy=h.r.t+h.r.h/2;
  return`<div class="hit" style="left:${cx}px;top:${cy}px;width:${d}px;height:${d}px;margin:${-d/2}px 0 0 ${-d/2}px"></div><div class="tbox" style="left:${h.r.l}px;top:${h.r.t}px;width:${h.r.w}px;height:${h.r.h}px"></div>`}).join('');
 return`<div class="en"></div><div class="fxr" style="left:${bl}px;top:${bt}px;width:${bw}px;height:${bh}px"><div class="fxz" style="width:${W}px;height:${H}px;transform:translate(${tx}px,${ty}px) scale(${sx},${sy})"><div class="at"></div></div></div>${hits}<div class="fl"></div><em>탭하여 연출 건너뛰기</em>`;
}
cutin=async function(u,s){
 const fxHint=window.__fxTgt;window.__fxTgt=null;
 if(/^dd/.test(u.id))return;
 const autoBtn=document.getElementById('autob');

 if(autoOn&&typeof fast!=='undefined'&&fast){clean();return}
 try{

  const portrait=(typeof CIL!=='undefined'&&CIL[u.id])||`<span style="font-size:48vh;line-height:1">${icon}</span>`;
  o.innerHTML=`<div class="bg"></div><div class="ch">${portrait}</div><div class="tt"><b>${skill}</b><small>${u.n} · ${f.kind||c.ds||'필살기 발동'}</small></div><div class="qt">${quote}</div><div class="bar b1"></div><div class="bar b2"></div><em>탭하여 연출 건너뛰기</em>`;
  void o.offsetWidth;
  o.dataset.p=1;ST(u.id,1);
  setTimeout(()=>{try{say(u.n,quote)}catch(e){}},180);
  for(let t=0;t<800&&!skip;t+=50)await sl(50);
  const skipped=skip;
  o.className='';o.innerHTML='';
  if(skipped){clean();return}
  const fx=document.getElementById('fx');

 }catch(e){console.error('cutin',e)}

idFrom=(el,fn)=>{const m=(el.getAttribute('onclick')||'').match(new RegExp(fn+"\\('([^']+)'\\)"));return m?m[1]:null};

 const pp=document.getElementById('pp');if(!pp)return false;

<script id="sfx-patch">

const ORDER=['stun','freeze','burn','poison','shock','bleed','cold','bind'];
const META={stun:['💫','기절'],freeze:['🧊','빙결'],burn:['🔥','화상'],poison:['☠','중독'],shock:['⚡','감전'],bleed:['🩸','출혈'],cold:['❄','냉기'],bind:['⛓','속박']};
const STACK={poison:1,cold:1};
const hs=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0)/4294967296};

  if(u.shk>0)s.shock=u.shk;

  if(u.cold>0)s.cold=u.cold;
  if(u.slw>0)s.bind=u.slw;

#dxh .st3 div{background:#0007;border-radius:4px;padding:2px 0}
#dxh .st3 small{display:block;font-size:10px;color:var(--mu)}
#dxh .st3 b{font-size:14px;color:var(--ac);letter-spacing:0}
#dxh .st3 .big{font-size:16px;color:#ff8a6a}
#dxh .r2{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
#dxh button{min-height:28px;padding:0 8px;font-size:12px}
#dxh button.on{border-color:var(--ac);color:var(--ac)}
#dxh .fxg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
#dxh .fxg button{padding:0;min-height:30px;font-size:11px}
</style>
<script id="dex-patch">
(function(){
const DX={lv:40,team:[],f:'all',q:'',def:0,last:0,burst:0,hits:0,total:0,snap:null,key:null,cur:[],lock:0,ready:0,fold:0,fxOpen:0,fxT:'d',pos:null};window.DX=DX;
const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const DX_GRADE_NAMES={0:'D',1:'C',2:'B',3:'A',4:'S',5:'SS',6:'N',7:'M'};
const DX_GRADE_COLORS={0:'#6b6f76',1:'#9aa0a8',2:'#5c9ec7',3:'#a78bd6',4:'#e0b44a',5:'#ff4d6d',6:'#b58a5a',7:'#b28cff'};
const gc=i=>DX_GRADE_COLORS[Number(GR[i])]||GC[GR[i]]||'#888',gn=i=>DX_GRADE_NAMES[Number(GR[i])]||GN[GR[i]]||'?',nf=n=>Math.round(n).toLocaleString('ko-KR');
const ml=i=>(1+.09*(DX.lv-1))*(GM[GR[i]]||1);
const st=i=>({hp:Math.round(C[i].hp*ml(i)),atk:Math.round(C[i].atk*ml(i)),spd:C[i].spd});
const list=()=>ALL.filter(i=>C[i]&&SK[i]).sort((a,b)=>GR[b]-GR[a]);

/* ---- 훈련장용 허수아비 · 가상 스테이지 등록 ---- */
const EI=E.push(['허수아비','🎯',999999,0,1,0,'가만히 서 있기',0,0,0])-1;
DGE.push({t:'훈련장',xp:0,sc:0,e:[[EI]],bg:'wall'});
const TK=100+DGE.length-1;

/* ---- 화면 뼈대 ---- */
function build(){
  if(DX.ready)return;DX.ready=1;
  const el=document.createElement('div');el.id='dex';el.className='sc';
  el.innerHTML=`<div class="dxtop"><button id="dxback">‹ 로비</button><b>훈련소</b>
  <input type="text" id="dxq" placeholder="이름 검색" autocomplete="off">
  <span class="dxch" id="dxch"></span>
  <label class="dxlv">Lv <input type="range" class="dxrg" min="1" max="40" value="${DX.lv}"><b class="dxlvn">${DX.lv}</b></label></div>
  <div class="dxgrid" id="dxgrid"></div>
  <div class="dxtray" id="dxtray"></div>`;
  document.body.appendChild(el);
  const d=document.createElement('div');d.id='dxd';document.body.appendChild(d);
  const h=document.createElement('div');h.id='dxh';h.innerHTML='<div class="hh"><span>⠿</span><b>🎯 허수아비</b><button id="dxfold">▾</button></div><div class="hb"></div>';document.body.appendChild(h);
  el.querySelector('#dxback').onclick=()=>show('lobby');
  el.querySelector('#dxq').oninput=e=>{DX.q=e.target.value.trim();grid()};
  el.querySelector('.dxrg').oninput=e=>setLv(+e.target.value);
  el.querySelector('#dxgrid').addEventListener('click',e=>{
    const c=e.target.closest('.dxc');if(!c)return;const i=c.dataset.i;
    if(e.target.closest('.dxt'))toggleTeam(i);else detail(i)});
  el.querySelector('#dxtray').addEventListener('click',e=>{
    const x=e.target.closest('[data-rm]');if(x){toggleTeam(x.dataset.rm);return}
    if(e.target.closest('.clr')){DX.team=[];grid();tray();return}
    if(e.target.closest('.go'))startTeam()});
  d.addEventListener('click',e=>{if(e.target===d)closeDetail()});
  h.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.d!=null){DX.def=+b.dataset.d;applyDef();hud();return}
    if(b.dataset.t){DX.fxT=b.dataset.t;hud();return}
    if(b.dataset.fx){applyStatus(b.dataset.fx);return}
    if(b.id=='dxfold'){h.classList.toggle('fold');b.textContent=h.classList.contains('fold')?'▸':'▾';return}
    if(b.id=='dxcd'){resetCd();return}
    if(b.id=='dxfxb'){DX.fxOpen=!DX.fxOpen;hud();return}
    if(b.id=='dxr')restart();if(b.id=='dxx')exitTrain()});
  let drag=null;const hh=h.querySelector('.hh');
  hh.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={x:e.clientX-h.offsetLeft,y:e.clientY-h.offsetTop};try{hh.setPointerCapture(e.pointerId)}catch(_){}});
  hh.addEventListener('pointermove',e=>{if(!drag)return;
    const x=Math.max(0,Math.min(innerWidth-h.offsetWidth,e.clientX-drag.x)),y=Math.max(0,Math.min(innerHeight-40,e.clientY-drag.y));
    h.style.left=x+'px';h.style.top=y+'px';DX.pos={x,y}});
  const end=()=>{drag=null};hh.addEventListener('pointerup',end);hh.addEventListener('pointercancel',end);
  const g=[...new Set(list().map(i=>GR[i]))].sort((a,b)=>b-a);
  el.querySelector('#dxch').innerHTML=['all',...g].map(k=>`<button data-f="${k}" ${k=='all'?'class="on"':''}>${k=='all'?'전체':GN[k]}</button>`).join('');
  el.querySelector('#dxch').addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;DX.f=b.dataset.f;
    el.querySelectorAll('#dxch button').forEach(x=>x.classList.toggle('on',x===b));grid()});
}
function setLv(v){
  DX.lv=Math.max(1,Math.min(LVMAX,v|0));
  document.querySelectorAll('.dxrg').forEach(x=>x.value=DX.lv);
  document.querySelectorAll('.dxlvn').forEach(x=>x.textContent=DX.lv);
  grid();if($('#dxd').classList.contains('on'))statsRefresh();
}
function grid(){
  const g=$('#dxgrid');if(!g)return;
  const q=DX.q;
  g.innerHTML=list().filter(i=>(DX.f=='all'||GR[i]==DX.f)&&(!q||C[i].n.includes(q)||i.includes(q))).map(i=>{
    const s=st(i),on=DX.team.includes(i);
    return`<div class="dxc${on?' on':''}" data-i="${i}"><span class="dxt">${on?'✓':'＋'}</span><span class="ic" style="background:${C[i].col}">${C[i].ic}</span><b>${esc(C[i].n)}</b><small style="color:${gc(i)}">${gn(i)}등급</small><small>HP ${nf(s.hp)} · 공 ${nf(s.atk)} · 속 ${s.spd}</small></div>`}).join('')||'<div style="grid-column:1/-1;text-align:center;color:var(--mu);padding:30px">검색 결과가 없어요</div>';
}
function tray(){
  const t=$('#dxtray');if(!t)return;
  t.innerHTML=`<em>🎯 훈련 팀 ${DX.team.length}/4</em>`+DX.team.map(i=>`<span class="chip"><span class="ic" style="background:${C[i].col}">${C[i].ic}</span>${esc(C[i].n)}<i data-rm="${i}">✕</i></span>`).join('')+(DX.team.length?'<button class="clr">비우기</button>':'<em>카드의 ＋를 눌러 팀을 만드세요 (최대 4명)</em>')+'<button class="go" style="margin-left:auto">🎯 훈련장 입장</button>';
}
function toggleTeam(i){
  const k=DX.team.indexOf(i);
  if(k>=0)DX.team.splice(k,1);
  else{if(DX.team.length>=4){toast('훈련 팀은 최대 4명이에요');return}DX.team.push(i)}
  grid();tray();if($('#dxd').classList.contains('on'))detail(i,1);
}

/* ---- 상세 ---- */
let DI=null;
function statsRefresh(){
  if(!DI)return;const s=st(DI),b=$('#dxst');if(!b)return;
  b.innerHTML=`<div>HP ${nf(s.hp)}</div><div>공격력 ${nf(s.atk)}</div><div>속도 ${s.spd}</div><div>등급 ${gn(DI)} ×${GM[GR[DI]]||1}</div>`;
}
function detail(i,keep){
  DI=i;const c=C[i],d=DT[i]||{role:c.ds,sk:[]},on=DX.team.includes(i);
  const kc=k=>k=='필살'?' u':k=='패시브'?' p':'';
  $('#dxd').innerHTML=`<div class="dxb2"><button class="cx">✕</button>
  <div class="dxl"><span class="ic big" style="background:${c.col}">${c.ic}</span>
  <h3>${esc(c.n)} <small style="color:${gc(i)}">${gn(i)}등급</small></h3>
  <small style="color:var(--mu)">${esc(c.ds||'')}</small>
  <label class="dxlv" style="margin-top:8px">Lv <input type="range" class="dxrg" min="1" max="40" value="${DX.lv}"><b class="dxlvn">${DX.lv}</b></label>
  <div class="stg" id="dxst"></div>
  <p style="color:var(--mu);margin:6px 0;font-size:12px">${d.role||''}</p>
  <div class="dxbt"><button class="tg">${on?'✓ 훈련 팀에서 빼기':'＋ 훈련 팀에 추가'}</button><button class="go solo">🎯 이 캐릭터로 훈련</button></div></div>
  <div class="dxr"><b style="font-size:13px;color:var(--ac)">스킬</b><div style="margin-top:6px">${(d.sk||[]).map(k=>`<div class="sk1"><b>${k[0]}</b><span class="kd${kc(k[1])}">${k[1]}</span> <small>${k[2]||''}</small><div style="color:var(--ac)">${k[3]||''}</div><p>${k[4]||k[3]||''}</p></div>`).join('')||'<small>스킬 정보가 없어요</small>'}</div></div></div>`;
  const m=$('#dxd'),bx=m.querySelector('.dxb2');
  bx.querySelector('.cx').onclick=closeDetail;
  bx.querySelector('.dxrg').oninput=e=>setLv(+e.target.value);
  bx.querySelector('.tg').onclick=()=>toggleTeam(i);
  bx.querySelector('.solo').onclick=()=>{closeDetail();trainStart(DX.team.length&&DX.team.includes(i)?DX.team:[i])};
  m.classList.add('on');statsRefresh();if(!keep)bx.scrollTop=0;
}
function closeDetail(){$('#dxd').classList.remove('on');DI=null}

/* ---- 훈련장 ---- */
function startTeam(){if(!DX.team.length){toast('훈련할 캐릭터를 먼저 선택하세요');return}trainStart(DX.team)}
function trainStart(ids){
  if(Date.now()<DX.lock){toast('잠시 후 다시 시도해 주세요');return}
  if(!DX.snap)DX.snap={party:G.party.slice(),j:Object.assign({},G.j),lv:Object.assign({},G.lv),eq:G.eq};
  G.eq=[];ids.forEach(i=>{G.j[i]=1;G.lv[i]=DX.lv});G.party=ids.slice();
  DX.cur=ids.slice();DX.last=0;DX.burst=0;DX.hits=0;DX.total=0;DX.key=null;
  window.__gTrain=1;
  fight(1,TK);
  S.train=1;
  const d=S.U.find(u=>u.side=='b');
  if(d){
    d.dummy=1;d.maxhp=999999;d.def=DX.def;d.spd=1;
    Object.defineProperty(d,'hp',{configurable:true,enumerable:true,
      get(){return d.maxhp},
      set(v){const x=d.maxhp-v;if(!(x>0))return;
        const k=(S.cur&&S.cur.id)+':'+S.rd;if(DX.key!==k){DX.key=k;DX.burst=0;DX.hits=0}
        DX.last=x;DX.burst+=x;DX.hits++;DX.total+=x;hud()}});
  }
  $('#dxd').classList.remove('on');
  $('#dxh').classList.add('on');placeHud();hud();render();
}
function applyDef(){const d=S&&S.U&&S.U.find(u=>u.dummy);if(d)d.def=DX.def}
const FXB=[['poison','☠','독'],['burn','🔥','화상'],['bleed','🩸','출혈'],['cold','❄','냉기'],['shock','⚡','감전'],['bind','⛓','속박'],['stun','💫','기절']];
function hud(){
  const b=document.querySelector('#dxh .hb');if(!b)return;
  b.innerHTML=`<div class="st3"><div><small>마지막 피해</small><b class="big">${DX.last?nf(DX.last):'—'}</b></div><div><small>이번 행동${DX.hits?' · '+DX.hits+'타':''}</small><b>${DX.hits?nf(DX.burst):'—'}</b></div><div><small>누적</small><b>${nf(DX.total)}</b></div></div>
  <div class="r2"><small style="color:var(--mu)">육성</small><button id="dxga" class="${G.trAw?'on':''}">각성 ${G.trAw?'ON':'OFF'}</button><button id="dxgs" class="${G.trSk?'on':''}">스킬강화 ${G.trSk?'ON':'OFF'}</button></div>
  <div class="r2"><small style="color:var(--mu)">방어력</small>${[0,30,60,100].map(v=>`<button data-d="${v}" class="${DX.def==v?'on':''}">${v}</button>`).join('')}</div>
  <div class="r2"><button id="dxcd">⏱ 쿨타임 초기화</button><button id="dxr">↺</button><button id="dxx">나가기</button></div>
  <div class="r2"><button id="dxfxb" class="${DX.fxOpen?'on':''}">🧪 상태이상 테스트 ${DX.fxOpen?'▴':'▾'}</button></div>`
  +(DX.fxOpen?`<div class="r2"><small style="color:var(--mu)">대상</small><button data-t="d" class="${DX.fxT=='d'?'on':''}">허수아비</button><button data-t="a" class="${DX.fxT=='a'?'on':''}">아군</button></div><div class="fxg">${FXB.map(([k,i,n])=>`<button data-fx="${k}">${i}${n}</button>`).join('')}<button data-fx="clear">✖해제</button></div>`:'');
  if(DX.fxOpen)fitHud();
}
function fitHud(){const h=$('#dxh');if(!h||!DX.pos)return;const y=Math.max(0,Math.min(DX.pos.y,innerHeight-110-h.offsetHeight));if(y!==DX.pos.y){DX.pos.y=y;h.style.top=y+'px'}}
function placeHud(){
  const h=$('#dxh');if(!DX.pos)DX.pos={x:Math.max(0,(innerWidth-h.offsetWidth)/2),y:46};
  DX.pos.x=Math.min(DX.pos.x,Math.max(0,innerWidth-h.offsetWidth));DX.pos.y=Math.min(DX.pos.y,Math.max(0,innerHeight-40));
  h.style.left=DX.pos.x+'px';h.style.top=DX.pos.y+'px';
}
function resetCd(){
  if(!S||!S.U||!S.train)return;
  S.U.filter(u=>u.side=='a').forEach(u=>{if(u.cd)for(const k in u.cd)u.cd[k]=0});
  log('⏱ 모든 스킬 쿨타임 초기화');toast('쿨타임을 초기화했어요');render();
}
function applyStatus(kind){
  if(!S||!S.train||!S.U)return;
  const A=S.U.filter(u=>u.side=='a'&&u.alive),d=S.U.find(u=>u.dummy),src=A[0]||S.cur;
  const tg=DX.fxT=='a'?A:(d?[d]:[]);
  tg.forEach(t=>{
    try{
      if(kind=='clear'){
        if(t.slw>0&&t.bs!=null)t.spd=t.bs;
        ['psn','psT','pdm','_poison','ebt','ebd','cold','coldT','stn','shk','shd','slw','bld','dn'].forEach(f=>{if(t[f])t[f]=0});
        t.brn=null;t._fxF=0;
      }else if(kind=='poison'){try{venom(t,src,1)}catch(e){t.psn=Math.min(5,(t.psn||0)+1);t.psT=3;t.pdm=Math.max(t.pdm||0,50)}}
      else if(kind=='burn'){
        if(t.side=='a'){try{BURN(t,.05,3)}catch(e){t.brn={t:3,p:.05}}}
        else{t.ebd=Math.max(t.ebd||0,Math.round(src.atk*.25));t.ebt=Math.max(t.ebt||0,3);log(`🔥 ${t.n} 화상! 3턴간 매 턴 -${t.ebd}`)}
      }
      else if(kind=='bleed'){t.bld=3;pop(t.id,'🩸');log(`🩸 ${t.n} 출혈 (연출 테스트 · 3라운드)`)}
      else if(kind=='cold'){try{chill(t,1)}catch(e){t.cold=(t.cold||0)+1;t.coldT=3}}
      else if(kind=='shock'){try{shock(t,src,2)}catch(e){t.shk=2;t.shd=50}}
      else if(kind=='bind'){try{bind(t,2)}catch(e){t.slw=2}}
      else if(kind=='stun'){try{stun(t)}catch(e){t.stn=1}}
    }catch(e){}
  });
  render();
}
function restart(){
  if(S&&S.train&&S.busy&&!S.over){toast('연출이 끝난 뒤 눌러 주세요');return}
  if(S){S.over=1;S.exited=1}DX.lock=Date.now()+300;
  setTimeout(()=>trainStart(DX.cur),320);
}
function exitTrain(){
  window.__gTrain=0;
  if(S&&S.train){S.over=1;S.exited=1}
  if(DX.snap){G.party=DX.snap.party;G.j=DX.snap.j;G.lv=DX.snap.lv;G.eq=DX.snap.eq;DX.snap=null}
  DX.lock=Date.now()+1500;
  $('#dxh').classList.remove('on');$('#res').className='';
  try{setMood('lobby')}catch(e){}
  show('dex');grid();tray();
}

/* ---- 엔진 연결: 허수아비는 공격하지 않고, 체력은 깎이지 않는다 ---- */
const _hurt=hurt;
hurt=function(t,v){if(S&&S.train&&S.cur&&S.cur.dummy&&t&&t.side==='a')return;return _hurt.apply(this,arguments)};
const _boss=bossAct;
bossAct=async function(b){
  if(S&&S.train&&b&&b.dummy){
    const n=S.lg.length;await _boss.apply(this,arguments);
    S.lg=S.lg.slice(0,n).concat(S.lg.slice(n).filter(l=>!(String(l).startsWith(b.n+'의 공격')||String(l).startsWith(b.n+':'))));
    log('🎯 허수아비는 가만히 서 있다');return}
  return _boss.apply(this,arguments)};
const _end=end;
end=function(w){
  if(S&&S.train){if(!S.exited){S.exited=1;toast('훈련 종료');exitTrain()}return}
  return _end.apply(this,arguments)};
const _render=render;
render=function(){
  const r=_render.apply(this,arguments);
  if(S&&S.train)document.querySelectorAll('#bt .bs span').forEach(s=>{if(/\/999999$/.test(s.textContent))s.textContent='∞'});
  return r};

/* ---- 로비 버튼 ---- */
function mount(){
  const top=document.querySelector('#lobby .top');if(!top||top.querySelector('#dxb'))return;
  const b=document.createElement('button');b.id='dxb';b.textContent='🎯 훈련소';
  b.onclick=()=>{build();grid();tray();show('dex')};
  top.insertBefore(b,top.querySelector('em')||null);
}
mount();
window.dexOpen=()=>{build();grid();tray();show('dex')};
window.DEX=DX;window.dexTrain=ids=>{build();trainStart(ids)};
})();
</script>
<style id="atkfx-css">
#afx{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
#afx>*{position:absolute;pointer-events:none;will-change:transform,opacity;box-sizing:border-box}
#afx svg{overflow:visible}
@media(prefers-reduced-motion:reduce){#afx{display:none}}
</style>
<script id="atkfx-js">
/* ===== 스킬별 공격 연출 (v1) =====
   · 일반 공격 / 스킬 1: 시전자 돌진·시전 동작 → (투사체) → 대상 타격 이펙트
   · 피해/회복/버프 숫자가 뜨는 순간 해당 대상 카드에 이펙트를 겹쳐 그림 (단일·전체 공통)
   · 필살기(u)는 기존 컷인 연출을 그대로 사용
   · 적의 공격도 아군 카드에 타격 연출 */
(function(){
if(typeof act==='undefined'||typeof render==='undefined')return;
const LAYER=document.createElement('div');LAYER.id='afx';document.body.appendChild(LAYER);
const SPD=()=>{try{return fast?.55:1}catch(e){return 1}};
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];
const mk=(css,html)=>{const e=document.createElement('div');e.style.cssText=css;if(html!=null)e.innerHTML=html;LAYER.appendChild(e);return e};
const an=(e,kf,o)=>{o=o||{};const a=e.animate(kf,{duration:(o.d||400)*SPD(),delay:(o.dl||0)*SPD(),easing:o.e||'ease-out',fill:'both'});a.onfinish=()=>e.remove();return a};
const wait=ms=>new Promise(r=>setTimeout(r,ms*SPD()));
const rc=el=>{if(!el)return null;const r=el.getBoundingClientRect();if(r.width<2||r.height<2)return null;return{l:r.left,t:r.top,w:r.width,h:r.height,cx:r.left+r.width/2,cy:r.top+r.height/2}};
const cardOf=u=>{try{const side=u.side==='b'?'b':'a',els=[...document.querySelectorAll(side==='b'?'#bt .bsw .bs':'#bt .al .u')],i=S.U.filter(x=>x.side===side).indexOf(u);return els[i]||null}catch(e){return null}};
const tRect=u=>{const el=cardOf(u),r=rc(el);if(!r)return null;if(u.side==='b'){r.cy=r.t+r.h*.45;r.s=Math.max(70,Math.min(190,Math.min(r.w,r.h)*1.05))}else r.s=Math.max(54,Math.min(110,r.h*1.7));return r};

<script id="growth-patch">
/* ===== 육성 심화: ① 캐릭터 각성·스킬 강화 ② 장비 세트·강화·재설정·분해 ③ 코인 sink(교환소) ===== */
(function(){try{
G.sk=G.sk||{};G.aw=G.aw||{};G.scrap=G.scrap||0;G.shop=G.shop||{st:{},rs:0};
const cn=()=>{try{$('#coin').textContent='🪙 '+G.coin}catch(e){}};
const OK=()=>{try{sfx('ui','ok')}catch(e){}};
const MK={helm:'hp',armor:'hp',weapon:'atk',glove:'atk',boots:'spd'},SN={hp:'HP',atk:'공격력',spd:'속도'};
const SB={hp:BV.helm,atk:BV.weapon,spd:BV.boots},CNT=[1,1,2,2,3],RM=[1,1.5,2.2,3.3,5];
const RNM=r=>RN[r]||'?';

/* ---------- ① 캐릭터: 각성(중복 뽑기 조각) + 스킬 강화 ---------- */
const AW_MAX=5,AW_SH=[1,2,3,5,8],AW_COIN=[1500,3000,5000,8000,12000],AW_RATE=.10; // 각성 보상 강화: HP·공격력 단계당 +10%
const SK_BASE=5,SK_RATE=.06;
const skCap=i=>Math.min(10,SK_BASE+(G.aw[i]||0));
const skCost=n=>120*n+50*n*n;           /* n레벨로 올리는 비용 */
const shards=i=>G.dup[i]||0;window.__AWSH=AW_SH;
window.gAwake=function(i){const a=G.aw[i]||0;if(a>=AW_MAX){toast('이미 최대 각성이에요');return}
 const sh=AW_SH[a],co=AW_COIN[a];if(shards(i)<sh){toast('각성 조각이 부족해요 ('+shards(i)+'/'+sh+')');return}if(G.coin<co){toast('코인이 부족해요');return}
 G.dup[i]-=sh;G.coin-=co;G.aw[i]=a+1;OK();cn();toast('✦ '+C[i].n+' 각성 '+(a+1)+'단계! HP·공격력 +'+Math.round((a+1)*AW_RATE*100)+'%'+(a+1>=5?' · 속도 +3':'')+' · 스킬 강화 한도 Lv.'+skCap(i));openCd(i)};
window.gSkill=function(i){const l=G.sk[i]||0,cap=skCap(i);if(l>=cap){toast(l>=10?'스킬 강화 최대예요':'각성하면 강화 한도가 늘어요');return}
 const co=skCost(l+1);if(G.coin<co){toast('코인이 부족해요');return}G.coin-=co;G.sk[i]=l+1;OK();cn();toast('⚔ '+C[i].n+' 스킬 강화 Lv.'+(l+1)+' · '+skTxt(i,l+1));openCd(i)};

/* ----- 스킬 강화: 캐릭터 컨셉(유형)별 보너스 ----- */
const ARCH={
 dps:{n:'딜러',dm:.06,ig:.012},
 aoe:{n:'광역·지속',dm:.06,ig:.01},
 tank:{n:'탱커·방벽',dm:.02,sh:.06,ts:.004,cd:1},
 heal:{n:'힐러',dm:.02,hl:.06,sh:.04,cd:1},
 buff:{n:'버퍼·시간',dm:.02,bf:.05,cd:1},
 ctrl:{n:'디버프·제어',dm:.04,vl:.025,cd:1},
 drain:{n:'흡혈·역전',dm:.05,ls:.035}};
const AMAP={
 tank:'raba brk ade gom kairen serban m_lord m_sta m_gua aeg rosetta bellkeeper jud miraSleep sil',
 heal:'rian ser orn ast har iseul m_pri',
 buff:'buf lyr tem sei seia mukheun m_cap erda',
 ctrl:'whp cad ren hayan m_aud m_jud rex raon margr m_king',
 drain:'car gsw ebr cond bar lib kai',
 aoe:'mag sir ray ven varg tha m_scr dod lum'};
const AOF={};Object.keys(AMAP).forEach(k=>AMAP[k].split(' ').forEach(i=>AOF[i]=k));
const archOf=i=>AOF[i]||'dps';
const pc=v=>Math.round(v*1000)/10;
/* 육성 효과 끄기: 토너먼트 극악(__gNo) / 훈련장(__gTrain, 스위치 G.trAw·G.trSk) */
const offAw=()=>!!(window.__gNo||(window.__gTrain&&!G.trAw)),offSk=()=>!!(window.__gTrain&&!G.trSk);
window.GARCH=id=>ARCH[archOf(id)];window.gGk=i=>G.sk[i]||0;
window.skTxt=function(i,l){const A=ARCH[archOf(i)],o=[];
 if(A.dm)o.push('스킬 피해 +'+pc(A.dm*l)+'%');if(A.ig)o.push('방어 무시 +'+pc(A.ig*l)+'%');
 if(A.hl)o.push('치유량 +'+pc(A.hl*l)+'%');if(A.sh)o.push('방벽량 +'+pc(A.sh*l)+'%');
 if(A.ts)o.push('행동 시 아군 방벽 +'+pc(A.ts*l)+'% (최대HP)');if(A.bf)o.push('버프 효과 +'+pc(A.bf*l)+'%');
 if(A.vl)o.push('공격한 적 약점 노출(1라운드) 받는 피해 +'+pc(A.vl*l)+'%');if(A.ls)o.push('흡혈 '+pc(A.ls*l)+'%');
 if(A.cd)o.push(l>=10?'필살 쿨다운 -2':l>=5?'필살 쿨다운 -1 (Lv.10에 -2)':'Lv.5에 필살 쿨다운 -1');
 return o.join(' · ')};
window.skPer=function(i){const A=ARCH[archOf(i)];return skTxt(i,1).replace(/Lv\.5에 필살 쿨다운 -1/,'Lv.5·10에 필살 쿨다운 단축')};
/* 피해: 유형 보너스 + 약점 노출 + 흡혈용 피해 합산 */
{const d0=deal;deal=function(u,e,x,ig){const L=u&&u.side==='a'&&!offSk()?(G.sk[u.id]||0):0;
 if(L){const A=ARCH[archOf(u.id)];x=x*(1+(A.dm||0)*L);if(A.ig)ig=Math.min(.6,(ig||0)+A.ig*L)}
 if(e&&e._vul&&S&&e._vul>=S.rd&&e._vc)x=x*(1+e._vc);
 const out=d0.call(this,u,e,x,ig);
 if(L&&S){S._dd=S._dd||{};S._dd[u.id]=(S._dd[u.id]||0)+(out||0)}
 return out}}
/* 행동 전 상태를 기록해 두었다가, 다음 차례로 넘어갈 때 치유·방벽·버프·쿨다운 보너스를 정산 */
{const A0=act;act=async function(k){const u=S&&S.cur;
 if(u&&u.side==='a'&&!S.busy&&!S.over&&u.cd[k]<=0&&G.sk[u.id]&&!offSk()){S._dd={};
  S._ps={u,k,al:S.U.filter(x=>x.side==='a').map(x=>({u:x,hp:x.hp,alive:x.alive,sh:x.sh||0,ba:x.ba||0})),en:S.U.filter(x=>x.side==='b').map(x=>({u:x,hp:x.hp}))}}
 return A0.apply(this,arguments)}}
{const N0=next;next=async function(){try{const p=S&&S._ps;if(p){S._ps=null;gSettle(p)}}catch(e){console.warn('growth-settle',e)}return N0.apply(this,arguments)}}
window.gSettle=gSettle;function gSettle(p){const u=p.u,L=G.sk[u.id]||0;if(!L)return;const A=ARCH[archOf(u.id)],m=[];let h=0,s=0,f=0;
 p.al.forEach(o=>{const a=o.u;
  const dh=(a.alive?a.hp:0)-(o.alive?o.hp:0);if(dh>0&&A.hl&&a.alive){const b=Math.round(dh*A.hl*L),r=Math.min(b,a.maxhp-a.hp);if(r>0){a.hp+=r;h+=r}}
  const ds=(a.sh||0)-o.sh;if(ds>0&&A.sh){const b=Math.round(ds*A.sh*L);if(b>0){a.sh=(a.sh||0)+b;s+=b}}
  const db=(a.ba||0)-o.ba;if(db>0&&A.bf){a.ba=(a.ba||0)+db*A.bf*L;f++}
  if(A.ts&&a.alive){const b=Math.round(a.maxhp*A.ts*L);if(b>0){a.sh=(a.sh||0)+b;s+=b}}});
 if(h)m.push('치유 +'+h);if(s)m.push('방벽 +'+s);if(f)m.push('버프 강화 ×'+f);
 const dd=(S._dd&&S._dd[u.id])||0;if(A.ls&&dd>0&&u.alive){const r=Math.min(Math.round(dd*A.ls*L),u.maxhp-u.hp);if(r>0){u.hp+=r;m.push('흡혈 +'+r)}}
 if(A.vl){let n=0;p.en.forEach(o=>{if(o.u.alive&&o.u.hp<o.hp){o.u._vul=S.rd+1;o.u._vc=A.vl*L;n++}});if(n)m.push('약점 노출 ×'+n)}
 if(A.cd&&p.k==='u'&&L>=5&&u.cd&&u.cd.u>0){const r=L>=10?2:1;u.cd.u=Math.max(0,u.cd.u-r);m.push('필살 쿨다운 -'+r)}
 if(m.length){try{log('✦ '+u.n+' 스킬 강화: '+m.join(' · '))}catch(e){}}}

/* ---------- ② 장비: 세트 · 강화 · 재설정 · 분해 ---------- */
const SETS=[
 {n:'잿불의 계보',s:'잿불',b2:{hp:.08},b4:{atk:.10},t2:'HP +8%',t4:'공격력 +10%'},
 {n:'병정의 맹세',s:'병정',b2:{atk:.06},b4:{hp:.12,spd:1},t2:'공격력 +6%',t4:'HP +12% · 속도 +1'},
 {n:'서릿바람',s:'서릿',b2:{spd:1},b4:{atk:.08,spd:2},t2:'속도 +1',t4:'공격력 +8% · 속도 +2'},
 {n:'강철 의지',s:'강철',b2:{hp:.10},b4:{hp:.10,atk:.06},t2:'HP +10%',t4:'HP +10% · 공격력 +6%'},
 {n:'방랑자의 길',s:'방랑',b2:{hp:.05,atk:.05},b4:{atk:.10,spd:1},t2:'HP·공격력 +5%',t4:'공격력 +10% · 속도 +1'}];
const setOf=it=>(it.id*7+3)%5;           /* 장비 이름 후보(5종)와 같은 규칙 → 같은 이름 계열끼리 세트 */
const EN_RATE=.08,EN_CAP=[5,6,8,10,10];
const enCoin=it=>Math.round(60*(1+it.r*.7)*Math.pow((it.up||0)+1,1.5));
const enScrap=it=>(1+it.r)*((it.up||0)+1);
const rrCoin=r=>[100,200,400,800,1500][r]||100,rrScrap=r=>[1,2,4,8,15][r]||1;
const dsScrap=it=>([2,5,12,30,70][it.r]||2)+Math.floor((it.sp||0)*.5);
const upv=(it,v)=>v+Math.round(v*EN_RATE*(it.up||0));

const e0=eqb;
eqb=function(i){const b=e0.apply(this,arguments);if(window.__gNo)return b;const c=C[i],m=mul(i),its=G.eq.filter(x=>x.eq==i),cnt={};
 its.forEach(it=>{const up=it.up||0;if(up){b[MK[it.sl]]+=Math.round(it.v*EN_RATE*up);(it.ss||[]).forEach(s=>{b[s.k]+=Math.round(s.v*EN_RATE*up)})}cnt[setOf(it)]=(cnt[setOf(it)]||0)+1});
 const bh=Math.round(c.hp*m),ba=Math.round(c.atk*m),ap=(o)=>{if(o.hp)b.hp+=Math.round(bh*o.hp);if(o.atk)b.atk+=Math.round(ba*o.atk);if(o.spd)b.spd+=o.spd};
 Object.keys(cnt).forEach(k=>{if(cnt[k]>=2)ap(SETS[k].b2);if(cnt[k]>=4)ap(SETS[k].b4)});
 const a=offAw()?0:(G.aw[i]||0);if(a){b.hp+=Math.round(bh*AW_RATE*a);b.atk+=Math.round(ba*AW_RATE*a);if(a>=AW_MAX)b.spd+=3}
 return b};
window.itSt2=it=>{const ss=(it.ss||[]).map(s=>SN[s.k]+' '+upv(it,s.v)).join(', ');return(it.up?'[+'+it.up+'] ':'')+SN[MK[it.sl]]+' +'+upv(it,it.v)+(ss?' (+'+ss+')':'')+' ⟡'+SETS[setOf(it)].s};

function rollSub(it){const ks=['hp','atk','spd'];for(let i=2;i>0;i--){const j=Math.random()*(i+1)|0;[ks[i],ks[j]]=[ks[j],ks[i]]}
 it.ss=ks.slice(0,CNT[it.r]||1).map(k=>({k,v:Math.max(1,Math.round(SB[k]*(1+.35*(it.lv-1))*(RM[it.r]||1)*.18*(.6+Math.random()*.8)))}))}
let ARM=null;
const find=id=>G.eq.find(x=>x.id==id);
window.wkEnh=function(id){const it=find(id);if(!it)return;const cap=EN_CAP[it.r]||5;if((it.up||0)>=cap){toast('최대 강화예요');return}
 const co=enCoin(it),sc=enScrap(it);if(G.coin<co||G.scrap<sc){toast('코인 또는 잿가루가 부족해요');return}
 G.coin-=co;G.scrap-=sc;it.sp=(it.sp||0)+sc;it.up=(it.up||0)+1;OK();cn();toast('🔨 '+it.nm+' +'+it.up+' 강화!');wkOpen()};
window.wkRe=function(id){const it=find(id);if(!it)return;const co=rrCoin(it.r),sc=rrScrap(it.r);if(G.coin<co||G.scrap<sc){toast('코인 또는 잿가루가 부족해요');return}
 if(ARM!=='r'+id){ARM='r'+id;wkOpen();return}ARM=null;G.coin-=co;G.scrap-=sc;rollSub(it);OK();cn();toast('🎲 세부 능력치를 다시 굴렸어요');wkOpen()};
window.wkDis=function(id){const it=find(id);if(!it||it.eq)return;if(it.r>=2&&ARM!=='d'+id){ARM='d'+id;wkOpen();return}ARM=null;
 const g=dsScrap(it);G.scrap+=g;G.eq.splice(G.eq.indexOf(it),1);OK();toast('♻ 분해 → 잿가루 +'+g);wkOpen()};
window.wkBulk=function(){const L=G.eq.filter(x=>!x.eq&&x.r<=1&&!(x.up>0));if(!L.length){toast('분해할 일반·희귀 장비가 없어요');return}
 let g=0;L.forEach(it=>{g+=dsScrap(it)});G.eq=G.eq.filter(x=>!L.includes(x));G.scrap+=g;OK();toast('♻ '+L.length+'개 분해 → 잿가루 +'+g);wkOpen()};
function wkEl(){let e=document.getElementById('wk');if(!e){e=document.createElement('div');e.id='wk';e.onclick=ev=>{if(ev.target===e)wkClose()};document.body.appendChild(e)}return e}
window.wkClose=()=>{ARM=null;wkEl().className='';try{if($('#bag').classList.contains('on'))rBag()}catch(e){}};
window.wkTab=s=>{G.wkSl=s;ARM=null;wkOpen()};
window.wkOpen=function(){const e=wkEl(),sl=G.wkSl||'all';
 const L=G.eq.filter(x=>sl=='all'||x.sl==sl).sort((a,b)=>b.r-a.r||b.lv-a.lv||(b.up||0)-(a.up||0));
 e.innerHTML=`<div class="bgb"><button class="cx" onclick="wkClose()">✕</button><h3>🔧 장비 공방 <small style="color:var(--ac)">🪙 ${G.coin} · 🌫 잿가루 ${G.scrap}</small></h3>
 <div style="color:var(--mu);font-size:11px">강화 +${Math.round(EN_RATE*100)}%/단계 · 같은 ⟡세트 장비 2개/4개 착용 시 보너스 · 재설정은 세부 능력치를 다시 굴려요 · 분해하면 잿가루를 얻고, 강화에 쓴 잿가루의 절반이 돌아와요</div>
 <div class="gbx">${SETS.map(s=>`<b>⟡${s.n}</b> <small>2세트 ${s.t2} · 4세트 ${s.t4}</small>`).join('<br>')}</div>
 <div class="gtab">${[['all','전체'],...SLS.map(s=>[s,SLN[s]])].map(([k,n])=>`<button class="${sl==k?'on':''}" onclick="wkTab('${k}')">${n}</button>`).join('')}<button class="hot" onclick="wkBulk()">♻ 일반·희귀 미착용 일괄 분해</button></div>
 <div style="max-height:46vh;overflow:auto">${L.length?L.map(it=>{const cap=EN_CAP[it.r]||5,up=it.up||0,mx=up>=cap,co=enCoin(it),sc=enScrap(it);
  return`<div class="gwr r${it.r}"><b>${it.nm}</b> <em>${RNM(it.r)}${up?' +'+up:''}</em> <em>⟡${SETS[setOf(it)].n}</em><small>${itSt(it)} · ${it.eq?C[it.eq].n+' 착용 중':'보관 중'}</small>
  <button class="hot" ${mx||G.coin<co||G.scrap<sc?'disabled':''} onclick="wkEnh(${it.id})">${mx?'강화 최대':`강화 +${up+1} · 🪙${co} 🌫${sc}`}</button>
  <button class="${ARM=='r'+it.id?'arm':''}" ${G.coin<rrCoin(it.r)||G.scrap<rrScrap(it.r)?'disabled':''} onclick="wkRe(${it.id})">${ARM=='r'+it.id?'한 번 더 눌러 확정':`재설정 · 🪙${rrCoin(it.r)} 🌫${rrScrap(it.r)}`}</button>
  <button class="${ARM=='d'+it.id?'arm':''}" ${it.eq?'disabled':''} onclick="wkDis(${it.id})">${ARM=='d'+it.id?'한 번 더 눌러 확정':`분해 → 🌫${dsScrap(it)}`}</button></div>`}).join(''):'<div class="gwr"><small>해당 장비가 없어요</small></div>'}</div></div>`;e.className='on'};

/* ---------- ③ 코인 sink: 재의 교환소 (한정 수량 · 유료 재입고) ---------- */
const SHOP=[
 {k:'scrap',n:'🌫 잿가루 묶음 ×10',d:'장비 강화·재설정 재료',p:300,lim:5,go:()=>{G.scrap+=10}},
 {k:'box',n:'📦 영웅 장비 상자',d:'영웅 등급 이상 장비 1개 (무작위 부위)',p:1500,lim:2,go:()=>{const lv=Math.max(7,...G.eq.map(x=>x.lv));const it=mkIt(lv,1,null,2);G.eq.push(it);toast('✦ '+RNM(it.r)+' '+it.nm+' ('+itSt(it)+')')}},
 {k:'scr',n:'📜 상급 경험치 두루마리 ×2',d:'캐릭터 경험치 +3000',p:1200,lim:3,go:()=>{G.it[2]=(G.it[2]||0)+2}}];
const SH_P=800,SH_LIM=2,rsCost=()=>Math.min(3000,500*((G.shop.rs||0)+1));
const bought=k=>G.shop.st[k]||0;
window.xsBuy=function(k,id){const s=SHOP.find(x=>x.k==k),key=k=='sh'?'sh_'+id:k,lim=k=='sh'?SH_LIM:s.lim,p=k=='sh'?SH_P:s.p;
 if(bought(key)>=lim){toast('이번 입고분은 매진이에요');return}if(G.coin<p){toast('코인이 부족해요');return}
 G.coin-=p;G.shop.st[key]=bought(key)+1;if(k=='sh'){G.dup[id]=(G.dup[id]||0)+1;toast('🔷'+C[id].ic+' '+C[id].n+' 각성 조각 +1')}else{s.go();if(k!='box')toast('구매: '+s.n)}OK();cn();xsOpen()};
window.xsRestock=function(){const c=rsCost();if(G.coin<c){toast('코인이 부족해요');return}G.coin-=c;G.shop.rs=(G.shop.rs||0)+1;G.shop.st={};OK();cn();toast('🔄 재입고! (-🪙'+c+')');xsOpen()};

<script id="training-grade-label-fix">
/* 훈련장 등급 표기 보정: 표시용 등급명을 등급 코드로 명시적으로 매핑 */
(function(){
  const names={0:'D',1:'C',2:'B',3:'A',4:'S',5:'SS',6:'N',7:'M'};
  const colors={0:'#6b6f76',1:'#9aa0a8',2:'#5c9ec7',3:'#a78bd6',4:'#e0b44a',5:'#ff4d6d',6:'#b58a5a',7:'#b28cff'};
  function fix(){
    const root=document.getElementById('dex'); if(!root||typeof GR==='undefined')return;
    root.querySelectorAll('.dxc[data-i]').forEach(card=>{
      const id=card.dataset.i, rank=Number(GR[id]), label=card.querySelector('small[style*="color"]');
      if(!label||!Object.prototype.hasOwnProperty.call(names,rank))return;
      const txt=names[rank]+'등급';
      if(label.textContent!==txt)label.textContent=txt;
      if(label.style.color!==colors[rank])label.style.color=colors[rank];
    });
    const modal=document.getElementById('dxd');
    if(modal&&modal.classList.contains('on')){
      const heading=modal.querySelector('.dxl h3 small');
      const id=heading&&modal.querySelector('.dxbt .solo')?.getAttribute('onclick')?.match(/'([^']+)'/)?.[1];
      if(heading&&id&&Object.prototype.hasOwnProperty.call(names,Number(GR[id]))){
        const rank=Number(GR[id]),txt=names[rank]+'등급';
        if(heading.textContent!==txt)heading.textContent=txt;
        if(heading.style.color!==colors[rank])heading.style.color=colors[rank];
      }

  }
  function start(){fix();const root=document.getElementById('dex');if(root)new MutationObserver(fix).observe(root,{subtree:true,childList:true});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>

const tier=n=>Math.min(3,(n-1)/10|0),fmul=n=>n%10==0?3:n%5==0?1.5:1,hmul=n=>1+.11*(n-1);

function comp(n){const r=rng(n),P=POOL[tier(n)];if(n%10==0)return[P.reduce((a,b)=>E[b][2]>E[a][2]?b:a)];return Array.from({length:n<4?2:3},()=>P[r()*P.length|0])}

{const s0=spawn;spawn=function(){s0();if(!S||S.k!==TK)return;const n=M.tw.f,m=hmul(n)*fmul(n),dm=Math.min(2.2,1+.025*(n-1));S.U.forEach(e=>{if(e.side!='b'||e._tw)return;e._tw=1;e.maxhp=Math.round(e.maxhp*m);e.hp=e.maxhp;e.def=Math.min(80,e.def+Math.round(n*.8));e.spd+=Math.min(18,Math.round(n*.4));e.p=Math.min(.35,e.p*dm);e.sp=Math.min(.5,e.sp*dm)})}}
{const e1=end;end=function(w){const t=!!(S&&!S.ended),k=t?S.k:-1;e1(w);if(!t)return;add('bat');if(!w)return;add('win');if(k>=100&&k<TK)add('dun');if(k!==TK)return;const x=M.tw,n=x.f;add('twr');let ex='';if(n>x.b){x.b=n;if(n%10==0){const b=200*(n/10);G.coin+=b;ex=' · 🎖 첫 돌파 보너스 🪙'+b}}x.f=n+1;sv();upd();const r=Q('#res'),rw=r&&r.querySelector('#rw');if(rw)rw.insertAdjacentHTML('afterbegin','<div>🗼 '+n+'층 돌파!'+ex+'</div>');if(r){const b=[...r.querySelectorAll('button')].find(b=>(b.getAttribute('onclick')||'').startsWith('nxt('));if(b){b.setAttribute('onclick','TW.next()');b.textContent='다음 층 ▶ ('+x.f+'F)'}}}}

function row(L,o,key){return L.map(d=>{const p=o.p[d.id]||0,cl=o.c[d.id],ok=p>=d.g;return`<div class="gxi"><span><b>${d.n}</b><br><small>${p}/${d.g} · ${rtxt(d)}</small></span><button ${cl||!ok?'disabled':''} class="${ok&&!cl?'hot':''}" onclick="MM.claim('${key}','${d.id}')">${cl?'수령 완료':ok?'받기':'진행 중'}</button></div>`}).join('')}

window.TW={open(){rTw();Q('#tw').className='on'},close(){Q('#tw').className=''},enter(){setup();TW.close();prep(1,TK)},next(){Q('#res').className='';setup();prep(1,TK)},reset(){M.tw.f=1;sv();rTw();toast('1층부터 다시 시작해요')}};

{const t=Q('#lobby .top');if(t&&!Q('#twb'))t.insertAdjacentHTML('beforeend','<button id="twb" class="glb" onclick="TW.open()">🗼 무한 던전</button><button id="mmb" class="glb" onclick="MM.open()">📅 임무·출석</button>')}
{const r0=rLobby;rLobby=function(){r0.apply(this,arguments);badge()}}

<script>

(()=>{
const KEY='rd_v1',Q=s=>document.querySelector(s);
const POOL=600000,RMAX=8,MAXT=3; /* 거신 주간 HP · 1회 전투 라운드 제한 · 하루 도전 횟수 */

const wkId=()=>{const d=new Date();return'W'+Math.floor((Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)-4)/7)};

const EI=E.push(['재의 거신','🗿',1,60,100,.12,'재의 대붕괴',.2,1,0])-1;
const RK=(DGE.push({t:'레이드 · 재의 거신',xp:0,sc:0,e:[[EI]],bg:'top'}),99+DGE.length);
CR[RK-104]=[0,0];
{const s0=spawn;spawn=function(){s0();if(!S||S.k!==RK)return;sync();S.U.forEach(e=>{if(e.side!='b'||e._rd)return;e._rd=1;e.maxhp=POOL;e.hp=R.cur;S.rd0=R.cur});try{log('🗿 레이드: '+RMAX+'라운드 안에 최대한 많은 피해를 주세요!')}catch(e){}}}
{const n0=next;next=function(){if(S&&S.k===RK&&!S.over&&!S.ended&&S.q.length==0&&S.rd>=RMAX){S.over=1;render();setTimeout(()=>end(0),600);return}return n0.apply(this,arguments)}}
{const e1=end;end=function(w){const t=!!(S&&!S.ended&&S.k===RK),b=t&&S.U.find(u=>u.side=='b');e1(w);if(!t)return;sync();
const dealt=Math.max(0,(S.rd0||R.cur)-Math.max(0,b?b.hp:R.cur)),coin=Math.min(3000,Math.max(10,Math.round(dealt/50)));
R.cur=Math.max(0,R.cur-dealt);R.tot+=dealt;R.n++;G.coin+=coin;sv();upd();
const r=Q('#res'),dead=R.cur<=0;r.className='on';
r.innerHTML=`<div class="bx"><h2>${dead?'🗿 거신 격파!':'레이드 종료'}</h2><div>⚔ 이번 피해 <b>${dealt.toLocaleString()}</b></div><div>🪙 코인 +${coin}</div><div style="color:var(--mu);margin-top:6px">${dead?'이번 주 거신을 쓰러뜨렸어요. 보상을 받아 가세요!':'거신 남은 HP '+R.cur.toLocaleString()+' / '+POOL.toLocaleString()}</div><div class="rb"><button onclick="document.querySelector('#res').className='';show('lobby')">로비</button><button onclick="document.querySelector('#res').className='';show('lobby');RD.open()">레이드</button></div></div>`}}
function rRd(){sync();const left=MAXT-R.n,dead=R.cur<=0,pct=Math.round((POOL-R.cur)/POOL*100);
Q('#rd').innerHTML=`<div class="dgb" style="border-color:#c0504a;overflow:auto"><button class="cx" onclick="RD.close()">✕</button><h3>레이드 <small style="color:var(--mu)">재의 거신</small></h3><p style="color:var(--mu);margin:4px 0 8px;font-size:12px">매주 나타나는 거대한 거신. ${RMAX}라운드 동안 싸워 피해가 누적되고, HP는 회복되지 않아요. 이번 주 안에 쓰러뜨리세요. (월요일 초기화)</p><div class="dgi"><b>🗿 ${R.cur.toLocaleString()} / ${POOL.toLocaleString()}</b><div style="height:10px;border-radius:5px;background:#0008;margin:6px 0;overflow:hidden"><i style="display:block;height:100%;width:${100-pct}%;background:#c0504a"></i></div><small>누적 피해 ${R.tot.toLocaleString()} · 오늘 도전 ${left}/${MAXT}회 남음</small></div><button class="dgo" ${left<=0||dead?'disabled':''} onclick="RD.enter()">${dead?'이번 주 격파 완료':left<=0?'오늘 횟수 소진':'도전 (남은 '+left+'회)'}</button><b style="display:block;margin-top:8px">피해 달성 보상</b>${MS.map((m,i)=>{const ok=pct>=m.p*100,cl=R.cl[i];return`<div class="gxi"><span><b>${m.p*100}% 달성</b><br><small>${rtxt(m)}</small></span><button ${cl||!ok?'disabled':''} class="${ok&&!cl?'hot':''}" onclick="RD.claim(${i})">${cl?'수령 완료':ok?'받기':'미달성'}</button></div>`}).join('')}</div>`}
window.RD={open(){rRd();Q('#rd').className='on'},close(){Q('#rd').className=''},

<script>
/* ===== 저장: 자동 저장 · 파일 내보내기/가져오기 · 저사양 모드 ===== */
(()=>{
const Q=s=>document.querySelector(s),KS=['g_v1','tnx_v1','mm_v1','rd_v1','cx_v1'],LF='lf_v1';
try{const s=JSON.parse(localStorage.getItem('g_v1')||'null');if(s&&s.lv&&s.j){Object.keys(s).forEach(k=>{G[k]=s[k]});try{rLobby()}catch(e){}try{Q('#coin').textContent='🪙 '+G.coin}catch(e){}}}catch(e){}
let off=0;const saveG=()=>{if(off)return;try{localStorage.setItem('g_v1',JSON.stringify(G))}catch(e){}};
setInterval(saveG,3000);addEventListener('pagehide',saveG);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveG()});
const dump=()=>{saveG();const ls={};KS.forEach(k=>{const v=localStorage.getItem(k);if(v!=null)ls[k]=v});return JSON.stringify({ver:1,at:new Date().toISOString(),ls})};
const lowOn=()=>localStorage.getItem(LF)=='1',applyLow=()=>document.body.classList.toggle('lowfx',lowOn());
function r(msg){const pd=SV._p?`<div class="rb"><button class="hot" onclick="SV.go()">${SV._p==='wipe'?'초기화 확정':'덮어쓰기 확정'}</button><button onclick="SV._p=null;SV.open()">취소</button></div>`:'';Q('#sv').innerHTML=`<div class="dgb" style="overflow:auto"><button class="cx" onclick="SV.close()">✕</button><h3>설정 · 저장</h3><p style="color:var(--mu);font-size:12px;margin:4px 0 8px">진행 상황은 이 브라우저에 자동 저장돼요. 브라우저 데이터가 지워지면 사라지니, 가끔 파일로 백업해 두세요.${msg?'<br><b style="color:var(--ac)">'+msg+'</b>':''}</p><div class="rb" style="flex-wrap:wrap"><button class="hot" onclick="SV.exp()">💾 파일로 내보내기</button><button onclick="SV.copy()">📋 복사</button></div><div class="rb" style="flex-wrap:wrap"><button onclick="document.querySelector('#svf').click()">📂 파일에서 가져오기</button><button onclick="SV.paste()">붙여넣기로 가져오기</button></div><input id="svf" type="file" accept=".json,application/json" style="display:none" onchange="SV.file(this)"><textarea id="svt" placeholder="복사해 둔 저장 내용을 여기에 붙여넣으세요" style="display:none;width:100%;height:80px;margin-top:8px;background:#0008;color:inherit;border:1px solid var(--ln);border-radius:6px"></textarea><div class="gxi" style="margin-top:10px"><span><b>저사양 모드</b><br><small>흐림 효과와 반복 애니메이션을 줄여 끊김을 완화해요</small></span><button class="${lowOn()?'hot':''}" onclick="SV.low()">${lowOn()?'켜짐':'꺼짐'}</button></div><div class="rb"><button onclick="SV.wipe()" style="color:#ff8a7a">저장 데이터 초기화</button></div>${pd}</div>`}
function imp(txt){let o;try{o=JSON.parse(txt)}catch(e){return r('파일을 읽을 수 없어요. 올바른 저장 파일인지 확인해 주세요.')}
if(!o||!o.ls||!o.ls.g_v1)return r('저장 데이터가 들어 있지 않은 파일이에요.');
SV._p=o;r('현재 진행 상황이 가져온 저장으로 덮어씌워져요. 아래에서 확정해 주세요.')}
function apply(o){off=1;try{KS.forEach(k=>{if(o.ls[k]!=null)localStorage.setItem(k,o.ls[k]);else localStorage.removeItem(k)})}catch(e){off=0;return r('저장에 실패했어요.')}location.reload()}
function wipeNow(){off=1;KS.forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});location.reload()}
window.SV={open(){r();Q('#sv').className='on'},close(){Q('#sv').className=''},
exp(){try{const b=new Blob([dump()],{type:'application/json'}),a=document.createElement('a'),d=new Date();a.href=URL.createObjectURL(b);a.download='jae-save-'+d.getFullYear()+(d.getMonth()+1)+d.getDate()+'.json';document.body.appendChild(a);a.click();a.remove();r('내보내기를 시작했어요. 다운로드가 안 되면 「복사」를 이용해 주세요.')}catch(e){r('내보내기에 실패했어요. 「복사」를 이용해 주세요.')}},
copy(){const t=dump();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>r('클립보드에 복사했어요. 메모 앱 등에 붙여넣어 보관하세요.')).catch(()=>{r();const x=Q('#svt');x.style.display='block';x.value=t;x.select();toast('아래 내용을 직접 복사해 주세요')})},

<script>

(()=>{
